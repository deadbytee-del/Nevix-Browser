name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: nevix-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/Nevix-Setup.exe
            dist/Nevix-Portable.exe
            dist/*.dmg
            dist/*.zip
