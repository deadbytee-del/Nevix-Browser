name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: End-to-end (real Chromium under Xvfb)
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb imagemagick libgbm1 libasound2t64 libnss3 libgtk-3-0t64
          sudo -E env "PATH=$PATH" sh test/run-e2e.sh
